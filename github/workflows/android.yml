name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Android
        uses: barichello/godot-ci@v6.1.1
        with:
          name: BaddieRunner
          preset: Android
          project: .
          godot_version: 4.5.1
          archive: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BaddieRunner-Android
          path: build/Android/*.apk
          if-no-files-found: error

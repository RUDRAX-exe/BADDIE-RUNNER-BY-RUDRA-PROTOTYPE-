name: Build Baddie Runner Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  GODOT_VERSION: 4.7.2
  PROJECT_PATH: .

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-24.04

    container:
      image: barichello/godot-ci:4.7.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot export templates
        run: |
          mkdir -p ~/.config
          mkdir -p ~/.local/share/godot/export_templates
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable \
            ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Build Android APK
        run: |
          mkdir -p build
          EXPORT_DIR="$(readlink -f build)"

          cd "$PROJECT_PATH"

          godot --headless --verbose \
            --export-debug "Android" \
            "$EXPORT_DIR/BaddieRunner.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BaddieRunner-APK
          path: build/BaddieRunner.apk
          if-no-files-found: error
